# Host Nginx site for servers that already run Nginx on ports 80/443.
# Install: curl -fsSLo /etc/nginx/sites-available/wow-saloon <raw-url> ; then certbot --nginx -d <domain>
server {
    listen 80;
    listen [::]:80;
    server_name wowsaloon.todoitservices.com;
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
